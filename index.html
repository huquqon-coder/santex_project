<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uy Konstruktor</title>
<meta name="description" content="Uy rejasi, isitish, elektr va santexnika tizimlarini loyihalash konstruktori.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Uy Konstruktor</h1>
  <nav class="seg" id="tabs" aria-label="Bo'limlar">
    <button data-t="plan" aria-pressed="true">Reja</button>
    <button data-t="heat" aria-pressed="false">Isitish</button>
    <button data-t="elec" aria-pressed="false">Elektr</button>
    <button data-t="plumb" aria-pressed="false">Santexnika</button>
    <button data-t="view3d" aria-pressed="false">3D</button>
    <button data-t="report" aria-pressed="false">Hisob</button>
  </nav>
  <div class="acts">
    <button id="undo" title="Ctrl+Z">Orqaga</button>
    <button id="redo">Oldinga</button>
    <button id="new">Yangi</button>
    <button id="sample">Namuna</button>
    <button id="import">Ochish</button>
    <button id="export">Saqlash</button>
    <a href="namuna/">Tayyor loyiha</a>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>

<main class="work">
  <div class="seg col" id="tools"></div>
  <div class="canvas">
    <div id="planWrap"><svg id="plan" role="application" aria-label="Uy rejasi muharriri"></svg></div>
    <div id="view3dWrap" hidden>
      <div id="gl"></div>
      <div class="over">
        <div class="seg" id="modes">
          <button data-m="cut" aria-pressed="true">Kesim</button>
          <button data-m="ghost" aria-pressed="false">Faqat tizimlar</button>
          <button data-m="full" aria-pressed="false">To'liq uy</button>
        </div>
        <label class="chk"><input type="checkbox" id="o-heat" checked> Isitish</label>
        <label class="chk"><input type="checkbox" id="o-elec" checked> Elektr</label>
        <label class="chk"><input type="checkbox" id="o-plumb" checked> Santexnika</label>
      </div>
      <p id="view3dErr" hidden></p>
    </div>
    <div id="reportWrap" hidden>
      <div class="rephead">
        <h2>Materiallar va narx</h2>
        <button id="print">Chop etish</button>
      </div>
      <p class="hint">Hajmlar loyihadan olinadi. Material narxini o'zingiz yozasiz. Ish haqi taxminiy, ustalar aytgan narx bilan almashtiring.</p>
      <div id="report"></div>
    </div>
  </div>
  <aside id="side"></aside>
</main>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
